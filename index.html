<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/calc.css">
    <title>Calculator</title>
</head>
<body>
    <main>
        <section>
            <h1>Simple Calculator</h1>
        </section>
        <section>
            <input type="number" id="insertFirstValue">
            <input type="number" id="insertSecondValue">
        </section>
        <section>
            <button class="addition">Add</button>
            <button class="subtract">Subtract</button>
            <button class="multiplacation">Multiply</button>
            <button class="division">Divide</button>
            <button class="clear">Clear</button>
            <h2>Here's your result 👇</h2>
            <h2 class="result"></h2>
        </section>
    </main>
    <script src="/js/calcscript.js"></script>
</body>
</html>
